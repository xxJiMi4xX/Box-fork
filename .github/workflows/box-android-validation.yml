name: Box Omni Voice debug APK validation

on:
  push:
    branches: [feature/lfm3-omni-android, feature/lfm3-omni-audio-stage, work/box-voice-phase0-20261104]
    paths:
      - "Android/**"
      - ".gitmodules"
      - ".github/workflows/box-android-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: box-android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout fork including pinned upstream submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Record source revisions
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git submodule status
          grep -E '^(agp|kotlin|litertlm) =' Android/src/gradle/libs.versions.toml
          grep 'distributionUrl=' Android/src/gradle/wrapper/gradle-wrapper.properties

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          sdk="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          test -n "$sdk"
          yes | "$sdk" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$sdk" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"

      - name: Install Vulkan shader toolchain and SPIR-V headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers
          # Keep host Vulkan C++ headers outside the NDK sysroot and away from
          # /usr/include, so Android clang does not see host libc headers.
          test -s /usr/include/vulkan/vulkan.hpp
          mkdir -p "$RUNNER_TEMP/box-vulkan-headers"
          cp -a /usr/include/vulkan "$RUNNER_TEMP/box-vulkan-headers/"
          if [ -d /usr/include/vk_video ]; then
            cp -a /usr/include/vk_video "$RUNNER_TEMP/box-vulkan-headers/"
          fi
          # SPIRV-Headers is another host-only header tree. Android's NDK
          # cross-compiler must see it explicitly; package discovery alone
          # provides CMake metadata, not compiler -I flags.
          test -s /usr/include/spirv/unified1/spirv.hpp
          cp -a /usr/include/spirv "$RUNNER_TEMP/box-vulkan-headers/"
          test -s "$RUNNER_TEMP/box-vulkan-headers/vulkan/vulkan.hpp"
          test -s "$RUNNER_TEMP/box-vulkan-headers/spirv/unified1/spirv.hpp"
          echo "BOX_VULKAN_HEADERS_DIR=$RUNNER_TEMP/box-vulkan-headers" >> "$GITHUB_ENV"

          # Fast Android cross-compilation smoke test for full public include
          # closure. Avoid a costly 800+ unit native build if any SDK header
          # still cannot be resolved.
          NDK_CLANG="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++"
          printf '#include <vulkan/vulkan.hpp>\n#include <spirv/unified1/spirv.hpp>\nint main() { return 0; }\n' |
            "$NDK_CLANG" -std=c++17 -fsyntax-only -x c++ - \
              -isystem "$RUNNER_TEMP/box-vulkan-headers"

      - name: Check bundled MediaTek LiteRT NPU libraries
        shell: bash
        run: |
          set -euo pipefail
          test -s Android/src/app/src/main/jniLibs/arm64-v8a/libLiteRtDispatch_MediaTek.so
          test -s Android/src/app/src/main/jniLibs/arm64-v8a/libLiteRtCompilerPlugin_MediaTek.so
          file Android/src/app/src/main/jniLibs/arm64-v8a/libLiteRtDispatch_MediaTek.so
          file Android/src/app/src/main/jniLibs/arm64-v8a/libLiteRtCompilerPlugin_MediaTek.so

      - name: Compile Kotlin first to detect UI and JNI bridge errors before native shaders
        working-directory: Android/src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :smollm:compileDebugKotlin :app:compileDebugKotlin \
            --no-daemon --stacktrace --console=plain --max-workers=2

      - name: Build complete Box debug APK (including unchanged LiteRT-LM)
        working-directory: Android/src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain --max-workers=2

      - name: Run focused voice/audio unit tests
        working-directory: Android/src
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests "com.google.ai.edge.gallery.ui.llmchat.VoiceTextSegmentsTest" \
            --tests "com.google.ai.edge.gallery.engine.WavPcm16Test" \
            --tests "com.google.ai.edge.gallery.engine.VoiceAudioBufferPolicyTest" \
            --tests "com.google.ai.edge.gallery.engine.LivePcm16ResamplerTest" \
            --tests "com.google.ai.edge.gallery.ui.llmchat.GgufConversationPairsTest" \
            --no-daemon --stacktrace --console=plain --max-workers=2

      - name: Verify MediaTek LiteRT NPU libraries are packaged in APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(Android/src/app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          unzip -Z1 "$apk" | grep -Fx "lib/arm64-v8a/libLiteRtDispatch_MediaTek.so"
          unzip -Z1 "$apk" | grep -Fx "lib/arm64-v8a/libLiteRtCompilerPlugin_MediaTek.so"
          echo "MediaTek NPU dispatch/compiler libraries confirmed in $apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" \
            | grep -F "name='com.box.gallery.omni.voice.dev'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" \
            | grep -F "application-label:'Box Voice'"
          sha256sum "$apk"

      - name: Upload debug APK if build succeeds
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: box-omni-voice-arm64-debug
          path: Android/src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
